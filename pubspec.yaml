name: easy_semver
description: >-
  Bump and sync a Flutter app's semantic version across pubspec.yaml, the iOS
  Xcode project and Android Gradle files, and repair drift between them.
version: 1.0.0
repository: https://github.com/Massinissa-Mouhoub/easy_semver

topics:
  - flutter
  - versioning
  - cli
  - release

environment:
  sdk: ^3.6.0

executables:
  bumpv:

dependencies:
  args: ^2.6.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
